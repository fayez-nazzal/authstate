name: Bug report
description: Report something that does not work
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the behaviour you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The exact command you ran
      render: sh
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: The output, including the exit code
      description: Add `; echo "exit $?"` to the end of the command to capture the exit code.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The `version` field of the JSON line, or the `version` in `package.json`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: For example `macOS 15.6` or `Ubuntu 24.04`.
    validations:
      required: true
