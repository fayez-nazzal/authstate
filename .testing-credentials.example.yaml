app: example-app
default: basic-user
credentials:
  basic-user:
    purpose: basic plan account for smoke tests
    email: basic-user@example.com
    password: replace-me
    app_url: http://localhost:3000
    signed_in_when:
      url_matches: "http://localhost:3000/dashboard/**"
  premium-user:
    purpose: premium plan account for paid feature tests
    email: premium-user@example.com
    password: replace-me
    app_url: http://localhost:3000
    # fields is optional. Add it only when the sign in form is non standard.
    # fields:
    #   email: "input[name='username']"
    #   password: "textarea[name='claims']"
    #   submit: "button[type='submit']"
    signed_in_when:
      url_matches: "http://localhost:3000/dashboard/**"
